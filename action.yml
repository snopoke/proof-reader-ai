name: "Proof Reader AI Action"
description: "Perform code reviews and comment on diffs on markdown article using OpenAI API."
inputs:
  GITHUB_TOKEN:
    description: "GitHub token to interact with the repository."
    required: true
  OPENAI_API_KEY:
    description: "OpenAI API key for GPT."
    required: true
  OPENAI_API_MODEL:
    description: "OpenAI API model."
    required: false
    default: "gpt-4o-mini"
  file-pattern:
    description: "Regex pattern to match files for review"
    required: false
    default: "\\.mdx$"
  prompt-prefix:
    description: "The initial instructions for the LLM indicating it's basic task."
    required: false
    default: "Your task is to review pull requests on a technical blog."
  strict-match:
    description: "Whether be strict about matching comment lines returned by the LLM."
    required: false
    default: true
runs:
  using: "node20"
  main: "lib/main.js"
